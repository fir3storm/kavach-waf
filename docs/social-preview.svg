<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shield Gradient -->
    <radialGradient id="shieldGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c73e54;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="100" r="150" fill="#e94560" opacity="0.1"/>
  <circle cx="1180" cy="540" r="200" fill="#533483" opacity="0.15"/>
  <circle cx="640" cy="320" r="300" fill="#e94560" opacity="0.05"/>
  
  <!-- Main Shield -->
  <g transform="translate(640, 280)">
    <!-- Shield Outer -->
    <path d="M 0,-120 
             C 60,-120 100,-80 100,-20 
             C 100,60 0,140 0,140 
             C 0,140 -100,60 -100,-20 
             C -100,-80 -60,-120 0,-120 Z" 
          fill="url(#shieldGradient)" 
          stroke="url(#goldGradient)" 
          stroke-width="4"
          filter="url(#glow)"/>
    
    <!-- Inner Shield Design -->
    <path d="M 0,-100 
             C 50,-100 80,-65 80,-15 
             C 80,50 0,115 0,115 
             C 0,115 -80,50 -80,-15 
             C -80,-65 -50,-100 0,-100 Z" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="2"/>
    
    <!-- Om Symbol -->
    <text x="0" y="25" 
          font-family="Arial, sans-serif" 
          font-size="80" 
          fill="url(#goldGradient)" 
          text-anchor="middle"
          font-weight="bold"
          filter="url(#glow)">ॐ</text>
  </g>
  
  <!-- Title -->
  <text x="640" y="480" 
        font-family="Arial, sans-serif" 
        font-size="72" 
        fill="url(#goldGradient)" 
        text-anchor="middle"
        font-weight="bold"
        letter-spacing="4"
        filter="url(#glow)">KAVACH</text>
  
  <!-- Subtitle -->
  <text x="640" y="530" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        fill="#ffffff" 
        text-anchor="middle"
        opacity="0.9">Web Application Firewall</text>
  
  <!-- Tagline -->
  <text x="640" y="570" 
        font-family="Arial, sans-serif" 
        font-size="18" 
        fill="#e94560" 
        text-anchor="middle"
        font-style="italic">Ancient Wisdom. Modern Security.</text>
  
  <!-- Author -->
  <text x="640" y="600" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        fill="#ffd700" 
        text-anchor="middle"
        opacity="0.9">by Abhirup Guha (Fir3St0rm) @ Info Security Solution</text>
  
  <!-- Features Icons Row -->
  <g transform="translate(640, 620)">
    <text x="-300" y="0" font-family="Arial" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">🛡️ SQL Injection</text>
    <text x="-100" y="0" font-family="Arial" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">🔥 XSS Protection</text>
    <text x="100" y="0" font-family="Arial" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">🌍 Geo Blocking</text>
    <text x="300" y="0" font-family="Arial" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">🤖 Bot Detection</text>
  </g>
  
  <!-- Corner Decorations -->
  <path d="M 20,20 L 80,20 L 80,30 L 30,30 L 30,80 L 20,80 Z" fill="url(#goldGradient)" opacity="0.5"/>
  <path d="M 1260,20 L 1200,20 L 1200,30 L 1250,30 L 1250,80 L 1260,80 Z" fill="url(#goldGradient)" opacity="0.5"/>
  <path d="M 20,620 L 80,620 L 80,610 L 30,610 L 30,560 L 20,560 Z" fill="url(#goldGradient)" opacity="0.5"/>
  <path d="M 1260,620 L 1200,620 L 1200,610 L 1250,610 L 1250,560 L 1260,560 Z" fill="url(#goldGradient)" opacity="0.5"/>
</svg>